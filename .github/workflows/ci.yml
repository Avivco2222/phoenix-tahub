name: CI

on:
  pull_request:
  push:
    branches: [main, master]

# Cancel any in-flight runs for the same branch so a fast follow-up
# commit doesn't wait for a slower previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phoenix-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: phoenix-dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # `next build` is the canonical "does production actually compile"
      # gate. Run with NODE_ENV=production explicitly so the env-aware
      # CSP in next.config.ts emits the production policy and any
      # accidental dev-only code path fails the build instead of slipping
      # through with looser config.
      - run: npm run build
        env:
          NODE_ENV: production

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Python version matches Vercel Fluid Compute's default (3.13) so we
    # don't ship code that compiles on the runner but breaks on Vercel.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # pytest needs a JWT_SECRET to import main.py — set a deterministic
      # one rather than relying on the fail-open PYTEST_CURRENT_TEST escape
      # hatch (which only kicks in when the var is unset).
      - name: Run tests
        env:
          JWT_SECRET: ci-deterministic-secret-not-for-production
          ADMIN_API_TOKEN: test-admin-token
          SESSION_UNLOCK_PIN: ci-pin
          ENV: test
        run: pytest -q
